server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:file:./data/wordvault;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  h2:
    console:
      enabled: true
      path: /h2-console
  devtools:
    restart:
      enabled: true
      poll-interval: 1s
      quiet-period: 400ms
    livereload:
      enabled: false   # 前端用 Vite HMR，不需要 livereload

wordvault:
  seed-data: true

logging:
  level:
    root: INFO
    com.wordvault: DEBUG
